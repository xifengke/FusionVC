name: Python checks
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    env:
      POLARS_MAX_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[evaluation,dev,geneformer,final_test]' -c requirements/windows-constraints.txt
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest -q
